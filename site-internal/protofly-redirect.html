<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0.8; url=https://park0er.github.io/multi-casual-android/xiaomi/" />
    <title>跳转到 Multica Xiaomi</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #101218;
        --muted: #5b6472;
        --blue: #1647ff;
        --paper: #f6f8fc;
        --card: #ffffff;
        --line: rgba(16, 18, 24, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
      }
      main {
        width: min(520px, calc(100vw - 32px));
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        box-shadow: 0 24px 70px rgba(16, 18, 24, 0.12);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 26px;
        line-height: 1.2;
        letter-spacing: 0;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.7;
        font-size: 15px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        background: var(--blue);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
      code {
        display: block;
        margin-top: 18px;
        overflow-wrap: anywhere;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>正在跳转到 Multica Xiaomi</h1>
      <p>这是小米内网入口，目标页面托管在 GitHub Pages。</p>
      <a href="https://park0er.github.io/multi-casual-android/xiaomi/">立即打开</a>
      <code>https://park0er.github.io/multi-casual-android/xiaomi/</code>
    </main>
  </body>
</html>
